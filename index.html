<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Photo Jigsaw Puzzle</title>
    <!-- โหลดไลบรารีสำหรับทำเอฟเฟกต์กระดาษโปรย -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #9333ea;
            --primary-hover: #7e22ce;
            --accent: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #fae8ff 100%);
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(147, 51, 234, 0.15);
            text-align: center;
            border: 1px solid #f3e8ff;
        }

        .badge-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #c084fc, #9333ea);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px auto;
            font-size: 26px;
            box-shadow: 0 8px 16px rgba(147, 51, 234, 0.25);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #9333ea, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .instruction-bar {
            background: #f8fafc;
            color: #475569;
            font-size: 0.82rem;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        /* Media Box */
        .media-box {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 16px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #f1f5f9;
            background: #090d16;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Buttons */
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #9333ea);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 0.98rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 15px rgba(147, 51, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(147, 51, 234, 0.4);
        }

        .btn-secondary {
            background: #f8fafc;
            color: var(--text);
            border: 1px solid #cbd5e1;
            padding: 10px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        .hidden {
            display: none !important;
        }

        /* Stats bar */
        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 10px 14px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 0.88rem;
            color: var(--text-muted);
            border: 1px solid #e2e8f0;
        }

        .stats-row span {
            color: var(--text);
            font-weight: 700;
        }

        .btn-peek {
            background: #f3e8ff;
            color: #9333ea;
            border: 1px solid #d8b4fe;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-peek:hover {
            background: #e9d5ff;
        }

        /* Puzzle Board */
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            width: 300px;
            height: 300px;
            margin: 0 auto 16px auto;
            background: #f1f5f9;
            border-radius: 16px;
            padding: 4px;
            border: 3px solid #e2e8f0;
        }

        .tile {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            cursor: pointer;
            background-size: 292px 292px;
            transition: transform 0.15s ease;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .tile:hover {
            transform: scale(0.96);
        }

        .tile.selected {
            outline: 3px solid var(--accent);
            transform: scale(0.92);
            z-index: 10;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .modal-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 24px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            max-width: 340px;
            width: 90%;
        }

        .win-preview-img {
            width: 180px;
            height: 180px;
            border-radius: 16px;
            object-fit: cover;
            margin: 0 auto 14px auto;
            display: block;
            border: 3px solid #f3e8ff;
            box-shadow: 0 8px 16px rgba(147, 51, 234, 0.15);
        }

        .modal-box img.peek-full {
            width: 280px;
            height: 280px;
            border-radius: 16px;
            display: block;
            margin: 0 auto 16px auto;
            object-fit: cover;
            border: 2px solid #e2e8f0;
        }

        .trophy-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: inline-block;
            animation: bounce 1.5s infinite ease-in-out;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .modal-stats {
            display: flex;
            justify-content: space-around;
            background: #f8fafc;
            padding: 12px;
            border-radius: 14px;
            margin: 14px 0 16px 0;
            font-size: 0.85rem;
            border: 1px solid #e2e8f0;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="badge-icon">🧩</div>
        <h1>Photo Jigsaw 3x3</h1>
        <p class="subtitle">ถ่ายรูปตัวเองแล้วมาลองต่อจิ๊กซอว์กัน!</p>
        <div class="instruction-bar">
            ℹ️ แตะเลือกชิ้นส่วน 2 ชิ้นเพื่อสลับตำแหน่งกัน
        </div>

        <!-- 1. CAMERA SECTION -->
        <div id="camera-section">
            <div class="media-box">
                <video id="webcam" autoplay playsinline></video>
            </div>
            <button id="capture-btn" class="btn-main">📸 ถ่ายรูปเพื่อสร้างจิ๊กซอว์</button>
            <div class="controls-row">
                <button id="switch-cam-btn" class="btn-secondary">🔄 สลับกล้อง</button>
            </div>
        </div>

        <!-- 2. GAME SECTION -->
        <div id="game-section" class="hidden">
            <div class="stats-row">
                <div>ขยับ: <span id="move-count">0</span> ครั้ง</div>
                <button id="peek-btn" class="btn-peek">👁️ แอบดูรูปเต็ม</button>
            </div>

            <div id="puzzle-board"></div>

            <div class="controls-row">
                <button id="restart-btn" class="btn-secondary">🔄 สลับใหม่</button>
                <button id="cam-back-btn" class="btn-secondary" style="color:#e11d48; border-color:#fecdd3;">📸
                    ถ่ายใหม่</button>
            </div>
        </div>
    </div>

    <!-- PEEK IMAGE MODAL -->
    <div id="peek-modal" class="modal-overlay">
        <div class="modal-box">
            <img id="peek-img" class="peek-full" src="" alt="Full Image">
            <button id="close-peek-btn" class="btn-main">✕ ปิดรูปภาพ</button>
        </div>
    </div>

    <!-- WIN MODAL (พร้อมเอฟเฟกต์กระดาษโปรย) -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="trophy-icon">🏆</div>
            <h2 style="color:#16a34a; font-size:1.4rem; margin-bottom:4px;">ยินดีด้วย!</h2>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:12px;">คุณต่อจิ๊กซอว์สำเร็จแล้ว 🎉</p>

            <!-- โชว์รูปเต็มหลังต่อเสร็จ -->
            <img id="win-img-preview" class="win-preview-img" src="" alt="Completed Puzzle">

            <div class="modal-stats">
                <div>เวลาที่ใช้<br><span id="final-time" style="color:var(--text); font-weight:bold;">00:00</span></div>
                <div style="border-left: 1px solid #e2e8f0; padding-left: 15px;">จำนวนการสลับ<br><span id="final-moves"
                        style="color:var(--text); font-weight:bold;">0 ครั้ง</span></div>
            </div>

            <button id="modal-restart-btn" class="btn-main">🎉 เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const captureBtn = document.getElementById('capture-btn');
        const switchCamBtn = document.getElementById('switch-cam-btn');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const cameraSection = document.getElementById('camera-section');
        const gameSection = document.getElementById('game-section');
        const puzzleBoard = document.getElementById('puzzle-board');
        const restartBtn = document.getElementById('restart-btn');
        const camBackBtn = document.getElementById('cam-back-btn');
        const modalRestartBtn = document.getElementById('modal-restart-btn');
        const winModal = document.getElementById('win-modal');
        const moveCountEl = document.getElementById('move-count');
        const finalTimeEl = document.getElementById('final-time');
        const finalMovesEl = document.getElementById('final-moves');
        const peekBtn = document.getElementById('peek-btn');
        const peekModal = document.getElementById('peek-modal');
        const peekImg = document.getElementById('peek-img');
        const winImgPreview = document.getElementById('win-img-preview');
        const closePeekBtn = document.getElementById('close-peek-btn');

        let currentStream = null;
        let facingMode = "user";
        let currentPieces = [];
        let originalPieces = [];
        let selectedTileIndex = null;
        let moves = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isGameOver = false;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 600 }, height: { ideal: 600 }, facingMode: facingMode }
                });
                video.srcObject = currentStream;
            } catch (err) {
                alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตสิทธิ์ใช้งานกล้อง");
            }
        }

        switchCamBtn.addEventListener('click', () => {
            facingMode = facingMode === "user" ? "environment" : "user";
            video.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
            startCamera();
        });

        startCamera();

        captureBtn.addEventListener('click', () => {
            const ctx = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = 300;
            hiddenCanvas.height = 300;

            ctx.save();
            if (facingMode === "user") {
                ctx.translate(300, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, 300, 300);
            ctx.restore();

            const currentImageUrl = hiddenCanvas.toDataURL();
            peekImg.src = currentImageUrl;
            winImgPreview.src = currentImageUrl;

            cameraSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            initGame();
        });

        function initGame() {
            moves = 0;
            secondsElapsed = 0;
            isGameOver = false;
            selectedTileIndex = null;
            winModal.style.display = 'none';
            peekModal.style.display = 'none';
            moveCountEl.innerText = moves;
            startTimer();

            const imageDataUrl = hiddenCanvas.toDataURL();
            originalPieces = [];

            for (let i = 0; i < 9; i++) {
                const row = Math.floor(i / 3);
                const col = i % 3;
                originalPieces.push({
                    id: i,
                    bgPosition: `-${col * 100}px -${row * 100}px`,
                    imgUrl: imageDataUrl
                });
            }

            shuffleAndRender();
        }

        function shuffleAndRender() {
            do {
                currentPieces = [...originalPieces].sort(() => Math.random() - 0.5);
            } while (checkIsSolved());
            renderBoard();
        }

        function renderBoard() {
            puzzleBoard.innerHTML = '';
            currentPieces.forEach((piece, index) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (selectedTileIndex === index) tile.classList.add('selected');

                tile.style.backgroundImage = `url(${piece.imgUrl})`;
                tile.style.backgroundPosition = piece.bgPosition;

                tile.addEventListener('click', () => handleTileClick(index));
                puzzleBoard.appendChild(tile);
            });
        }

        function handleTileClick(index) {
            if (isGameOver) return;

            if (selectedTileIndex === null) {
                selectedTileIndex = index;
            } else if (selectedTileIndex === index) {
                selectedTileIndex = null;
            } else {
                [currentPieces[selectedTileIndex], currentPieces[index]] =
                    [currentPieces[index], currentPieces[selectedTileIndex]];

                selectedTileIndex = null;
                moves++;
                moveCountEl.innerText = moves;

                if (checkIsSolved()) {
                    handleWin();
                }
            }
            renderBoard();
        }

        function checkIsSolved() {
            return currentPieces.every((piece, idx) => piece.id === idx);
        }

        function handleWin() {
            isGameOver = true;
            clearInterval(timerInterval);

            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            finalTimeEl.innerText = `${mins}:${secs}`;
            finalMovesEl.innerText = `${moves} ครั้ง`;

            winModal.style.display = 'flex';

            // เรียกใช้งานเอฟเฟกต์กระดาษโปรย (Confetti) แบบจัดเต็ม
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 90,
                    origin: { y: 0.6 }
                });
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
            }, 1000);
        }

        peekBtn.addEventListener('click', () => {
            peekModal.style.display = 'flex';
        });

        closePeekBtn.addEventListener('click', () => {
            peekModal.style.display = 'none';
        });

        peekModal.addEventListener('click', (e) => {
            if (e.target === peekModal) {
                peekModal.style.display = 'none';
            }
        });

        restartBtn.addEventListener('click', shuffleAndRender);

        const backToCamera = () => {
            clearInterval(timerInterval);
            winModal.style.display = 'none';
            peekModal.style.display = 'none';
            gameSection.classList.add('hidden');
            cameraSection.classList.remove('hidden');
            startCamera();
        };

        camBackBtn.addEventListener('click', backToCamera);
        modalRestartBtn.addEventListener('click', backToCamera);
    </script>
</body>

</html>
