<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Photo Jigsaw Puzzle</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 26px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, .4);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e0e7ff, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Media Box */
        .media-box {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 20px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #090d16;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Buttons */
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        .hidden {
            display: none !important;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stats-bar span {
            color: var(--text);
            font-weight: 700;
        }

        /* Puzzle Board */
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            width: 320px;
            height: 320px;
            margin: 0 auto 16px auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 6px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .tile {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            cursor: pointer;
            background-size: 308px 308px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .tile:hover {
            transform: scale(0.96);
        }

        .tile.selected {
            outline: 3px solid var(--accent);
            transform: scale(0.92);
            z-index: 10;
            box-shadow: 0 0 20px var(--accent);
        }

        .tile-number {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Modal Popup ชนะเกม */
        #win-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #win-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 32px;
            border-radius: 28px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #win-modal.show .modal-content {
            transform: scale(1);
        }

        .trophy-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: inline-block;
            animation: bounce 1.5s infinite ease-in-out;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .modal-content h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #34d399;
            margin-bottom: 6px;
        }

        .modal-content p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-stats {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="badge-icon">🧩</div>
        <h1>Photo Jigsaw 3x3</h1>
        <p class="subtitle">ถ่ายรูปหรือเลือกรูปภาพเพื่อสร้างเกมจิ๊กซอว์ของคุณ</p>

        <!-- 1. CAMERA SECTION -->
        <div id="camera-section">
            <div class="media-box">
                <video id="webcam" autoplay playsinline></video>
            </div>
            <button id="capture-btn" class="btn-main">📸 ถ่ายรูปเพื่อสร้างจิ๊กซอว์</button>
            <div class="controls-row">
                <button id="switch-cam-btn" class="btn-secondary">🔄 สลับกล้อง</button>
            </div>
        </div>

        <!-- 2. GAME SECTION -->
        <div id="game-section" class="hidden">
            <div class="stats-bar">
                <div>เวลาที่ใช้: <span id="timer">00:00</span></div>
                <div>จำนวนการสลับ: <span id="move-count">0</span> ครั้ง</div>
            </div>

            <div id="puzzle-board"></div>

            <div class="controls-row">
                <button id="hint-btn" class="btn-secondary">👁️ ซ่อน/แสดง ตัวเลข</button>
                <button id="restart-btn" class="btn-secondary">🔄 ถ่ายใหม่</button>
            </div>
        </div>
    </div>

    <!-- WIN MODAL POPUP -->
    <div id="win-modal">
        <div class="modal-content">
            <div class="trophy-icon">🏆</div>
            <h2>ยินดีด้วย!</h2>
            <p>คุณต่อจิ๊กซอว์สำเร็จแล้ว!</p>

            <div class="modal-stats">
                <div>เวลาที่ใช้<br><span id="final-time" style="color:#fff; font-weight:bold;">00:52</span></div>
                <div style="border-left: 1px solid rgba(255,255,255,0.1);">จำนวนการสลับ<br><span id="final-moves"
                        style="color:#fff; font-weight:bold;">17 ครั้ง</span></div>
            </div>

            <button id="modal-restart-btn" class="btn-main">🎉 เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const captureBtn = document.getElementById('capture-btn');
        const switchCamBtn = document.getElementById('switch-cam-btn');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const cameraSection = document.getElementById('camera-section');
        const gameSection = document.getElementById('game-section');
        const puzzleBoard = document.getElementById('puzzle-board');
        const restartBtn = document.getElementById('restart-btn');
        const modalRestartBtn = document.getElementById('modal-restart-btn');
        const hintBtn = document.getElementById('hint-btn');
        const winModal = document.getElementById('win-modal');
        const moveCountEl = document.getElementById('move-count');
        const timerEl = document.getElementById('timer');
        const finalTimeEl = document.getElementById('final-time');
        const finalMovesEl = document.getElementById('final-moves');

        let currentStream = null;
        let facingMode = "user";
        let currentPieces = [];
        let originalPieces = [];
        let selectedTileIndex = null;
        let moves = 0;
        let showHints = true;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isGameOver = false;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 600 }, height: { ideal: 600 }, facingMode: facingMode }
                });
                video.srcObject = currentStream;
            } catch (err) {
                alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตสิทธิ์ใช้งานกล้อง");
            }
        }

        switchCamBtn.addEventListener('click', () => {
            facingMode = facingMode === "user" ? "environment" : "user";
            video.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
            startCamera();
        });

        startCamera();

        captureBtn.addEventListener('click', () => {
            const ctx = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = 320;
            hiddenCanvas.height = 320;

            ctx.save();
            if (facingMode === "user") {
                ctx.translate(320, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, 320, 320);
            ctx.restore();

            cameraSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            initGame();
        });

        function initGame() {
            moves = 0;
            secondsElapsed = 0;
            isGameOver = false;
            selectedTileIndex = null;
            winModal.classList.remove('show');
            moveCountEl.innerText = moves;
            startTimer();

            const imageDataUrl = hiddenCanvas.toDataURL();
            originalPieces = [];

            for (let i = 0; i < 9; i++) {
                const row = Math.floor(i / 3);
                const col = i % 3;
                originalPieces.push({
                    id: i,
                    bgPosition: `-${col * 106.66}px -${row * 106.66}px`,
                    imgUrl: imageDataUrl
                });
            }

            do {
                currentPieces = [...originalPieces].sort(() => Math.random() - 0.5);
            } while (checkIsSolved());

            renderBoard();
        }

        function renderBoard() {
            puzzleBoard.innerHTML = '';
            currentPieces.forEach((piece, index) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (selectedTileIndex === index) tile.classList.add('selected');

                tile.style.backgroundImage = `url(${piece.imgUrl})`;
                tile.style.backgroundPosition = piece.bgPosition;

                if (showHints && !isGameOver) {
                    const numLabel = document.createElement('div');
                    numLabel.className = 'tile-number';
                    numLabel.innerText = piece.id + 1;
                    tile.appendChild(numLabel);
                }

                tile.addEventListener('click', () => handleTileClick(index));
                puzzleBoard.appendChild(tile);
            });
        }

        function handleTileClick(index) {
            if (isGameOver) return;

            if (selectedTileIndex === null) {
                selectedTileIndex = index;
            } else if (selectedTileIndex === index) {
                selectedTileIndex = null;
            } else {
                [currentPieces[selectedTileIndex], currentPieces[index]] =
                    [currentPieces[index], currentPieces[selectedTileIndex]];

                selectedTileIndex = null;
                moves++;
                moveCountEl.innerText = moves;

                if (checkIsSolved()) {
                    handleWin();
                }
            }
            renderBoard();
        }

        function checkIsSolved() {
            return currentPieces.every((piece, idx) => piece.id === idx);
        }

        function handleWin() {
            isGameOver = true;
            clearInterval(timerInterval);

            finalTimeEl.innerText = timerEl.innerText;
            finalMovesEl.innerText = `${moves} ครั้ง`;
            winModal.classList.add('show');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerEl.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        hintBtn.addEventListener('click', () => {
            showHints = !showHints;
            renderBoard();
        });

        const resetToCamera = () => {
            clearInterval(timerInterval);
            winModal.classList.remove('show');
            gameSection.classList.add('hidden');
            cameraSection.classList.remove('hidden');
            startCamera();
        };

        restartBtn.addEventListener('click', resetToCamera);
        modalRestartBtn.addEventListener('click', resetToCamera);
    </script>
</body>

</html>
